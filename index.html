<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Blueprint landing · Drafting, illustrated.</title>
    <meta
      name="description"
      content="A scroll-driven blueprint landing-page concept with authored SVG drawings and an illustrated CAD dashboard. No AI conversion or CAD export."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem('theme') === 'blue') {
          document.documentElement.dataset.theme = 'blue';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f3768');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
